databaseChangeLog:
  - changeSet:
    id: 001-create-subscriptions-table
    author: Alex_Buraev
    changes:

      - createTable:
          tableName: subscriptions
          remarks: Таблица подписок
          columns:

            - column:
                name: id
                type: BIGSERIAL
                constraints:
                  primaryKey: true
                  nullable: false

            - column:
                name: user_id
                type: BIGINT
                constraints:
                  nullable: false
                  unique: false
                  uniqueConstraintName: uk_subscription_use_id

            - column:
                name: active
                type: BOOLEAN
                defaultValueBoolean: false
                constraints:
                  nullable: false

            - column:
                name: expires_at
                type: TIMESTAMP

            - column:
                name: created_at
                type: TIMESTAMP
                defaultValueComputed: NOW()
                constraints:
                  nullable: false


            - column:
                name: updated_at
                type: TIMESTAMP
                defaultValueComputed: NOW()
                constraints:
                  nullable: false

      - createIndex:
        tableName: subscriptions
        indexName: idx_subscriptions_user_id
        columns:
          - column:
              name: user_id